<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Handoff page: gerivan.me/status.html now lives at https://url-status.gerivan.me/ (repo gerivanc/url-status).
     The script keeps the #TYPE/domain fragment. If you edit the inline script, recompute its SHA-256 in the CSP below. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-m5spEb5vrMck9y/0ZqnQ4guw+6XDKHn5TX5+pjgU36I='; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="gerivan.me status moved to Domain X-Ray at url-status.gerivan.me: live DNS propagation, security grade and 24/7 monitoring for any domain.">
<meta name="theme-color" content="#0d001a">
<link rel="canonical" href="https://url-status.gerivan.me/">
<meta http-equiv="refresh" content="4;url=https://url-status.gerivan.me/#NS/gerivan.me">
<title>Domain X-Ray · gerivan.me status</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛰️%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#0d001a;--panel:rgba(10,14,39,.72);--line:rgba(0,240,255,.28);--primary:#00f0ff;--secondary:#ff00aa;--accent:#8a2be2;--text:#e6f1ff;--mute:#8fa3c7;--ok:#39ff14}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(ellipse at 20% 0%,#1a0033 0,transparent 55%),radial-gradient(ellipse at 90% 100%,#001a33 0,transparent 55%),var(--bg);color:var(--text);
       font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px;overflow:hidden}
  .stars{position:fixed;inset:0;background-image:radial-gradient(1px 1px at 10% 20%,#fff8,transparent),radial-gradient(1px 1px at 70% 30%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#fff7,transparent),radial-gradient(1px 1px at 85% 70%,#fff5,transparent),radial-gradient(1px 1px at 25% 60%,#fff6,transparent),radial-gradient(1.5px 1.5px at 60% 10%,#fff8,transparent);pointer-events:none}
  .card{position:relative;max-width:560px;width:100%;text-align:center;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(10px);padding:34px 28px 26px;box-shadow:0 0 40px rgba(0,240,255,.15)}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:18px 18px 0 0;background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent))}
  .orbit{position:relative;width:150px;height:150px;margin:0 auto 18px}
  .planet{position:absolute;inset:47px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#4fd1ff,#1a3a8a 60%,#0a1640);box-shadow:0 0 24px rgba(0,240,255,.45)}
  .ring{position:absolute;inset:8px;border:1.5px dashed rgba(0,240,255,.35);border-radius:50%}
  .sat{position:absolute;inset:0;animation:spin 3.2s linear infinite}
  .sat span{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-size:28px;filter:drop-shadow(0 0 8px rgba(255,0,170,.6))}
  .beam{position:absolute;left:50%;top:22px;width:2px;height:38px;transform:translateX(-50%);background:linear-gradient(var(--secondary),transparent);opacity:.8}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:clamp(24px,5vw,32px);margin:0;letter-spacing:2px;background:linear-gradient(90deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin:10px 0;color:var(--mute)}
  p b{color:var(--text)}
  .target{display:block;margin:16px 0 6px;font-family:ui-monospace,"JetBrains Mono",Consolas,monospace;font-size:14px;color:var(--primary);word-break:break-all}
  .btn{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:12px 22px;border-radius:12px;background:linear-gradient(135deg,#00bfff,var(--accent));color:#fff;font-weight:700;letter-spacing:1px;text-decoration:none}
  .btn:hover,.btn:focus-visible{box-shadow:0 0 18px rgba(0,240,255,.6);outline:none}
  .bar{height:4px;border-radius:2px;background:rgba(0,240,255,.15);margin:18px auto 0;max-width:260px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--secondary));animation:fill 1.6s ease-out forwards}
  @keyframes fill{to{width:100%}}
  small{display:block;margin-top:18px;color:var(--mute);font-size:12.5px}
  small a,a{color:var(--primary)}
  @media (prefers-reduced-motion:reduce){.sat,.bar i{animation:none}.bar i{width:100%}}
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<main class="card">
  <div class="orbit" aria-hidden="true"><div class="ring"></div><div class="planet"></div><div class="sat"><span>🛰️</span><div class="beam"></div></div></div>
  <h1>DOMAIN X-RAY</h1>
  <p>The gerivan.me status page has moved to orbit.<br><b>Handing over to the satellite…</b></p>
  <a class="target" id="target" href="https://url-status.gerivan.me/#NS/gerivan.me">https://url-status.gerivan.me/#NS/gerivan.me</a>
  <a class="btn" id="go" href="https://url-status.gerivan.me/#NS/gerivan.me">🛰️ Open Domain X-Ray</a>
  <div class="bar" aria-hidden="true"><i></i></div>
  <small>Live DNS propagation, security grade and 24/7 monitoring for any domain. · <a href="https://gerivan.me/">← back to gerivan.me</a></small>
</main>
<script>
(function () {
  var BASE = 'https://url-status.gerivan.me/';
  var h = location.hash, ok = /^#(A|AAAA|CNAME|MX|NS|SOA|TXT|CAA|DS|DNSKEY)\/[a-z0-9.-]{1,253}$/i.test(h);
  var dest = BASE + (ok ? h : '#NS/gerivan.me');
  var t = document.getElementById('target'), g = document.getElementById('go');
  t.href = g.href = dest; t.textContent = dest;
  var fast = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(function () { location.replace(dest); }, fast ? 0 : 1600);
})();
</script>
</body>
</html>
